[project]
name = "neutron-transport-pinns"
version = "3.3.0"
description = "Automated system for neutron transport simulations with parallel execution and TUI/CLI interfaces"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual>=0.50.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
]

[project.scripts]
nts = "cli.main:main"
nts-1d-data = "utils.extract_1d_flux:main"
nts-1d-plot = "utils.plot_1d_flux:main"
nts-1d-excel = "utils.excel_1d:main"
nts-1d-normalize = "utils.normalize_1d:main"
nts-1d-run = "cli.run_1d:cli"
nts-1d-run-dd = "cli.run_1d:cli_dd"
nts-1d-run-step = "cli.run_1d:cli_step"
nts-1d-run-sc = "cli.run_1d:cli_sc"
nts-1d-config = "utils.generate_1d_config:main"
nts-generate = "cli.generate_placeholder:cli"
nts-test = "cli.run_tests:main"
tests = "cli.run_tests:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli", "core", "execution", "utils", "solvers*"]

[tool.setuptools]
