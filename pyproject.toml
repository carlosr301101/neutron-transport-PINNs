[project]
name = "neutron-transport-pinns"
dynamic = ["version"]
description = "Automated system for neutron transport simulations with parallel execution and TUI/CLI interfaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Carlos Rafael Gonzalez Alejo", email = "carlosr301101@gmail.com" },
]
keywords = [
    "neutron transport",
    "discrete ordinates",
    "PINN",
    "TUI",
    "nuclear engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "textual>=8.0.0,<9",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
]

[project.scripts]
nts = "cli.main:main"
nts-1d-data = "utils.extract_1d_flux:main"
nts-1d-plot = "utils.plot_1d_flux:main"
nts-1d-excel = "utils.excel_1d:main"
nts-1d-normalize = "utils.normalize_1d:main"
nts-1d-run = "cli.run_1d:cli"
nts-1d-run-dd = "cli.run_1d:cli_dd"
nts-1d-run-step = "cli.run_1d:cli_step"
nts-1d-run-sc = "cli.run_1d:cli_sc"
nts-1d-config = "utils.generate_1d_config:main"
nts-tui = "tui.app:main"
nts-generate = "cli.generate_placeholder:cli"

[project.optional-dependencies]
images = ["textual-image>=0.8"]

[project.urls]
Homepage = "https://carlosr301101.is-a.dev"
Repository = "https://github.com/carlosr301101/neutron-transport-PINNs"
Issues = "https://github.com/carlosr301101/neutron-transport-PINNs/issues"
Documentation = "https://github.com/carlosr301101/neutron-transport-PINNs/tree/main/doc"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "tui._version.__version__" }

[tool.setuptools.packages.find]
include = ["cli", "core", "execution", "utils", "tui*", "solvers*"]

[tool.setuptools]

[tool.setuptools.package-data]
tui = ["*.tcss"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "SIM117", "I001", "E501", "B007", "RUF059"]
