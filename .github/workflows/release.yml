name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/neutron-transport-pinns/
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Check tag matches package version
        shell: bash
        run: |
          version="$(uv run --frozen --quiet python -c 'from tui._version import __version__; print(__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build distributions
        run: uv build --clear

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Publish with trusted publishing
        run: uv publish --trusted-publishing automatic
