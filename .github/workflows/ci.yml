name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra images
      - name: Build 2D solvers (Linux)
        if: runner.os == 'Linux'
        run: make -C solvers
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build 2D solvers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./solvers/build_windows.ps1 -Gcc "C:\msys64\ucrt64\bin\gcc.exe"
      - name: Run tests
        run: uv run python -m cli.run_tests
      - name: Lint
        if: runner.os == 'Linux'
        run: uvx ruff check --select F,E9 .
      - name: Windows legacy console (cp1252)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'cp1252'
          $env:NTS_HOME = Join-Path $env:RUNNER_TEMP 'nts-ci'
          New-Item -ItemType Directory -Force -Path $env:NTS_HOME | Out-Null

          $status = uv run --frozen --quiet python -m cli.main status 2>&1 | Out-String
          Write-Host $status
          if ($LASTEXITCODE -ne 0) { throw "nts status failed: $LASTEXITCODE" }
          if ($status -match 'UnicodeEncodeError|Unexpected error') {
            throw 'encoding error in nts status'
          }
          if ($status -notmatch 'OK') { throw 'ASCII OK marker missing in nts status' }

          $config = Join-Path $env:NTS_HOME 'config.json'
          @{
            num_regions = 1
            num_zones = 1
            NC = @(10)
            HR = @(10.0)
            IZL = @(1)
            SCT = @(1.0)
            SCS = @(0.5)
            NU_SIGF = @(0.0)
            Q = @(1.0)
            N = 2
            SPATIAL_SCHEME = 'DD'
            reflex_izq = $false
            reflex_der = $false
            bound_left = @(0)
            bound_right = @(0)
            MODE = 'fixed_source'
          } | ConvertTo-Json | Set-Content -Path $config -Encoding ascii

          $output = Join-Path $env:NTS_HOME 'output.json'
          $run = uv run --frozen --quiet python -m cli.main run-1d --json $config -o $output 2>&1 | Out-String
          Write-Host $run
          if ($LASTEXITCODE -ne 0) { throw "nts run-1d failed: $LASTEXITCODE" }
          if ($run -notmatch 'OK Completed 1 run') {
            throw 'checkmark fallback missing in run-1d output'
          }
          if ($run -match '\? Completed') {
            throw 'checkmark was replaced by a question mark'
          }

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build --clear
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
